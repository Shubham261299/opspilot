# CI: every push and pull request is checked on a fresh machine, from scratch.
name: CI

# When to run: a push to any branch, and any pull request.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest # a brand-new Linux virtual machine, lent by GitHub for this run
    defaults:
      run:
        working-directory: backend # every `run:` step below starts in backend/

    # A throwaway Postgres started next to this job before the steps run, and deleted after.
    # Same image as docker-compose.yml, so CI tests the same database version.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot # a test database that lives only for this run; not a secret
          POSTGRES_DB: opspilot_test
        ports:
          - 5432:5432 # reachable from the steps as localhost:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    # Environment variables for every step. The tests read TEST_DATABASE_URL
    # (see backend/tests/integration/conftest.py).
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://opspilot:opspilot@localhost:5432/opspilot_test

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip # reuse downloaded packages between runs, as long as requirements are unchanged
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest -v # -v prints every test's name, so the log shows exactly what ran
