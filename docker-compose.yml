# Run everything:  docker compose up --build   then open http://localhost:3000
name: opspilot

services:
  db:
    # Postgres 16 with the pgvector extension (policy search, v0.4); same major version as before
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      # Host port 5433 so it doesn't clash with a Postgres installed directly on the machine.
      # Lets you run the API and tests from your machine against this database.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: . # repo root, so the image can include the seed CSVs (see .dockerignore)
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-opspilot}@db:5432/${POSTGRES_DB:-opspilot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # The sample data describes 24 Sep 2026, so the demo treats that day as "today"
      # (overdue days and the 90-day sales window depend on it). Set APP_TODAY to change it.
      APP_TODAY: ${APP_TODAY:-2026-09-24}
      # The language model (decision 024): Ollama running on this computer, reached from
      # inside the container through host.docker.internal.
      # 14b for the demo: more accurate than 7b, 2.6x slower (decision 029); 7b for quick dev runs
      LLM_MODEL: ${LLM_MODEL:-ollama_chat/qwen2.5:14b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      # The model that turns policy rules and questions into vectors for search (decision 043).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-ollama/nomic-embed-text}
      # Optional tracing in Langfuse (decision 041); empty = off.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    extra_hosts:
      - "host.docker.internal:host-gateway" # Docker Desktop has this name; Linux needs this line
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # healthy = the API answers /health, which also checks the database
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build: ./frontend
    ports:
      - "3000:80" # the web app: http://localhost:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
