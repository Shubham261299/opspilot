# Run everything:  docker compose up --build
name: opspilot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opspilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opspilot}
      POSTGRES_DB: ${POSTGRES_DB:-opspilot}
    ports:
      # Host port 5433 so it doesn't clash with a Postgres installed directly on the machine.
      # Lets you run the API and tests from your machine against this database.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: . # repo root, so the image can include the seed CSVs (see .dockerignore)
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-opspilot}:${POSTGRES_PASSWORD:-opspilot}@db:5432/${POSTGRES_DB:-opspilot}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
