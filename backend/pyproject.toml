# Tool configuration only. Dependencies are pinned in requirements*.txt.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B likely bugs, UP modern syntax, SIM simplifications
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A deprecated call in our own code fails the tests, so it gets fixed right away.
filterwarnings = ["error::DeprecationWarning:app"]
