# Alembic (database migrations) configuration.
# The database URL is deliberately NOT here: env.py reads DATABASE_URL via app/config.py.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
path_separator = os
# Files are named like 20260929_1a2b3c4d5e6f_initial_schema.py, so they sort by date.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# Lint and format every newly generated migration with ruff.
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
# E501 (line length) is skipped here because the format hook right after wraps long lines.
ruff_fix.options = check --fix --quiet --ignore E501 REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
