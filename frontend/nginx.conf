server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads pass through here to the API; allow a little over its 5 MB limit so the
    # API (not nginx) answers with a clear JSON error.
    client_max_body_size 6m;

    # Docker's internal DNS. Looking "api" up again every 10s keeps the proxy working
    # after the API container is recreated (it may get a new address).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/products -> http://api:8000/products (the /api prefix is removed).
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path (/stock, /issues, ...) is a page of the React app: serve index.html
    # and let React Router pick the page.
    location / {
        try_files $uri /index.html;
    }
}
